name: Release Distribution (All Platforms & Formats)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "main"
      - "master"
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release-artifacts:
    name: Release (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64 (.zip, .7z, .msi, .exe)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: app.exe
            out_bin: codecontext.exe
            pkg_prefix: codecontext-x86_64-pc-windows-msvc
            deb_arch: ""
            rpm_arch: ""
            arch_pkg_arch: ""
            enable_pgo: true
            enable_msi: true
            rustflags: "-C target-cpu=x86-64-v3 -C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=/OPT:REF,ICF"
          - label: Windows ARM64 (.zip, .7z, .exe)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin_name: app.exe
            out_bin: codecontext.exe
            pkg_prefix: codecontext-aarch64-pc-windows-msvc
            deb_arch: ""
            rpm_arch: ""
            arch_pkg_arch: ""
            enable_pgo: false
            enable_msi: false
            rustflags: "-C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=/OPT:REF,ICF"
          - label: Linux x86_64 (.tar.gz, .tar.xz, .tar.zst, .zip, .deb, .rpm, .pkg.tar.zst, .AppImage)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: app
            out_bin: codecontext
            pkg_prefix: codecontext-x86_64-unknown-linux-gnu
            deb_arch: amd64
            rpm_arch: x86_64
            arch_pkg_arch: x86_64
            enable_pgo: true
            enable_msi: false
            rustflags: "-C target-cpu=x86-64-v3 -C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=-Wl,--gc-sections,-O3"
          - label: Linux ARM64 (.tar.gz, .tar.xz, .tar.zst, .zip, .deb, .rpm, .pkg.tar.zst, .AppImage)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: app
            out_bin: codecontext
            pkg_prefix: codecontext-aarch64-unknown-linux-gnu
            deb_arch: arm64
            rpm_arch: aarch64
            arch_pkg_arch: aarch64
            enable_pgo: false
            enable_msi: false
            rustflags: "-C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=-Wl,--gc-sections,-O3"
          - label: macOS Apple Silicon (.tar.gz, .zip, .dmg, .pkg)
            os: macos-latest
            target: aarch64-apple-darwin
            bin_name: app
            out_bin: codecontext
            pkg_prefix: codecontext-aarch64-apple-darwin
            deb_arch: ""
            rpm_arch: ""
            arch_pkg_arch: ""
            enable_pgo: true
            enable_msi: false
            rustflags: "-C target-cpu=apple-m1 -C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=-Wl,-dead_strip"
          - label: macOS Intel x86_64 (.tar.gz, .zip, .dmg, .pkg)
            os: macos-latest
            target: x86_64-apple-darwin
            bin_name: app
            out_bin: codecontext
            pkg_prefix: codecontext-x86_64-apple-darwin
            deb_arch: ""
            rpm_arch: ""
            arch_pkg_arch: ""
            enable_pgo: false
            enable_msi: false
            rustflags: "-C target-cpu=x86-64-v3 -C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=-Wl,-dead_strip"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Git tag matches VERSION and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          echo "Tag=${TAG_VER}, VERSION=${FILE_VER}, Cargo.toml=${CARGO_VER}"
          test "${TAG_VER}" = "${FILE_VER}"
          test "${TAG_VER}" = "${CARGO_VER}"

      - name: Install Linux system and packaging libraries (deb, rpm, zstd, xz, zip)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils lld clang libclang-dev pkg-config rpm zstd xz-utils zip file \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxi-dev

      - name: Install Rust stable toolchain with LLVM PGO tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install cargo-nextest
        if: matrix.enable_pgo
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.7.8
        with:
          key: release-${{ matrix.target }}

      - name: Run full release test suite & allocation invariants
        if: matrix.enable_pgo
        run: |
          cargo test --package app --test architecture --locked --target ${{ matrix.target }}
          cargo nextest run --workspace --release --locked --target ${{ matrix.target }}
          cargo test --release --locked --target ${{ matrix.target }} --package scanner --test heap_allocations -- --test-threads=1

      - name: Compile maximally optimized release binary (PGO + Fat LTO + CGU=1)
        shell: bash
        run: |
          if [ "${{ matrix.enable_pgo }}" = "true" ]; then
            PGO_DIR="${RUNNER_TEMP}/pgo-profiles"
            rm -rf "${PGO_DIR}"
            mkdir -p "${PGO_DIR}"

            echo "=== [PGO 1/3] Building instrumented binary ==="
            RUSTFLAGS="${{ matrix.rustflags }} -C profile-generate=${PGO_DIR}" \
              cargo build --release --locked --package app --target ${{ matrix.target }}

            echo "=== [PGO 2/3] Training profile on real repository workload ==="
            for _ in 1 2 3 4 5; do
              "./target/${{ matrix.target }}/release/${{ matrix.bin_name }}" --pack-headless . || true
            done

            LLVM_PROFDATA="$(find "$(rustc --print sysroot)" -name "llvm-profdata*" -type f | head -n 1)"
            if [ -n "${LLVM_PROFDATA}" ] && "${LLVM_PROFDATA}" merge -o "${PGO_DIR}/merged.profdata" "${PGO_DIR}"; then
              echo "=== [PGO 3/3] Recompiling with PGO + Fat LTO + CGU=1 ==="
              cargo clean --release --package app --package scanner --package apply --package config --package core
              RUSTFLAGS="${{ matrix.rustflags }} -C profile-use=${PGO_DIR}/merged.profdata -C llvm-args=-pgo-warn-missing-function" \
                cargo build --release --locked --package app --target ${{ matrix.target }}
            else
              echo "=== PGO profile merge skipped: building clean Fat LTO release binary ==="
              cargo clean --release --package app --package scanner --package apply --package config --package core
              RUSTFLAGS="${{ matrix.rustflags }}" \
                cargo build --release --locked --package app --target ${{ matrix.target }}
            fi
          else
            RUSTFLAGS="${{ matrix.rustflags }}" \
              cargo build --release --locked --package app --target ${{ matrix.target }}
          fi

      - name: Package Windows artifacts (.zip, .7z, standalone .exe, WiX .msi installer)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          MSI_VER="$(echo "${VER}" | cut -d '-' -f 1)"
          mkdir -p dist out
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.out_bin }}"
          cp LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION dist/

          cp "dist/${{ matrix.out_bin }}" "out/${{ matrix.pkg_prefix }}.exe"
          (cd dist && 7z a -tzip "../out/${{ matrix.pkg_prefix }}.zip" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION)
          (cd dist && 7z a -t7z "../out/${{ matrix.pkg_prefix }}.7z" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION)

          if [ "${{ matrix.enable_msi }}" = "true" ] && [ -n "${WIX:-}" ]; then
            cat > installer.wxs <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="CodeContext" Language="1033" Version="${MSI_VER}" Manufacturer="CodeContext Contributors" UpgradeCode="68B8235D-4A3E-4E79-9F6A-8C1234567890">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perUser" Platform="x64" Description="CodeContext Desktop &amp; CLI" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of CodeContext is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="LocalAppDataFolder">
                  <Directory Id="ProgramsDir" Name="Programs">
                    <Directory Id="INSTALLFOLDER" Name="CodeContext" />
                  </Directory>
                </Directory>
              </Directory>
              <DirectoryRef Id="INSTALLFOLDER">
                <Component Id="MainExecutable" Guid="31F5D6A2-7B9E-4C1A-8E55-9A1B2C3D4E5F" Win64="yes">
                  <File Id="CodeContextExe" Source="dist/codecontext.exe" KeyPath="no" />
                  <RegistryValue Root="HKCU" Key="Software\CodeContext" Name="Installed" Type="integer" Value="1" KeyPath="yes" />
                  <Environment Id="PATH" Name="PATH" Value="[INSTALLFOLDER]" Permanent="no" Part="last" Action="set" System="no" />
                  <RegistryKey Root="HKCU" Key="Software\Classes\Directory\shell\CodeContext">
                    <RegistryValue Type="string" Name="MUIVerb" Value="CodeContext" />
                    <RegistryValue Type="string" Name="Icon" Value="&quot;[INSTALLFOLDER]codecontext.exe&quot;,0" />
                    <RegistryValue Type="string" Name="SubCommands" Value="" />
                  </RegistryKey>
                  <RegistryKey Root="HKCU" Key="Software\Classes\Directory\shell\CodeContext\shell\01_pack">
                    <RegistryValue Type="string" Value="Copy Context (with .gitignore)" />
                    <RegistryValue Type="string" Name="MUIVerb" Value="Copy Context (with .gitignore)" />
                  </RegistryKey>
                  <RegistryKey Root="HKCU" Key="Software\Classes\Directory\shell\CodeContext\shell\01_pack\command">
                    <RegistryValue Type="string" Value="&quot;[INSTALLFOLDER]codecontext.exe&quot; --pack-headless &quot;%V\.&quot;" />
                  </RegistryKey>
                  <RegistryKey Root="HKCU" Key="Software\Classes\Directory\shell\CodeContext\shell\02_apply">
                    <RegistryValue Type="string" Value="Apply AI Patch (Autofix)" />
                    <RegistryValue Type="string" Name="MUIVerb" Value="Apply AI Patch (Autofix)" />
                  </RegistryKey>
                  <RegistryKey Root="HKCU" Key="Software\Classes\Directory\shell\CodeContext\shell\02_apply\command">
                    <RegistryValue Type="string" Value="&quot;[INSTALLFOLDER]codecontext.exe&quot; --apply-headless &quot;%V\.&quot;" />
                  </RegistryKey>
                  <RegistryKey Root="HKCU" Key="Software\Classes\Directory\shell\CodeContext\shell\03_open_gui">
                    <RegistryValue Type="string" Value="Open in CodeContext GUI" />
                    <RegistryValue Type="string" Name="MUIVerb" Value="Open in CodeContext GUI" />
                  </RegistryKey>
                  <RegistryKey Root="HKCU" Key="Software\Classes\Directory\shell\CodeContext\shell\03_open_gui\command">
                    <RegistryValue Type="string" Value="&quot;[INSTALLFOLDER]codecontext.exe&quot; --project &quot;%V\.&quot;" />
                  </RegistryKey>
                </Component>
              </DirectoryRef>
              <Feature Id="ProductFeature" Title="CodeContext" Level="1">
                <ComponentRef Id="MainExecutable" />
              </Feature>
            </Product>
          </Wix>
          EOF
            "${WIX}/bin/candle.exe" -nologo -arch x64 installer.wxs -o installer.wixobj
            "${WIX}/bin/light.exe" -nologo -sval installer.wixobj -o "out/${{ matrix.pkg_prefix }}.msi"
          fi

          cd out
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: Package Linux artifacts (.tar.gz, .tar.xz, .tar.zst, .zip, .deb, .rpm, .pkg.tar.zst, .AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          RPM_VER="$(echo "${VER}" | tr '-' '_')"
          mkdir -p dist out
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.out_bin }}"
          chmod 0755 "dist/${{ matrix.out_bin }}"
          cp LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION dist/

          tar -C dist -czf "out/${{ matrix.pkg_prefix }}.tar.gz" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION
          tar -C dist -cJf "out/${{ matrix.pkg_prefix }}.tar.xz" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION
          tar -C dist --zstd -cf "out/${{ matrix.pkg_prefix }}.tar.zst" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION
          (cd dist && zip -q "../out/${{ matrix.pkg_prefix }}.zip" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION)

          DEB_DIR="deb_root"
          mkdir -p "${DEB_DIR}/DEBIAN" "${DEB_DIR}/usr/bin" "${DEB_DIR}/usr/share/applications"
          cp "dist/${{ matrix.out_bin }}" "${DEB_DIR}/usr/bin/codecontext"
          chmod 0755 "${DEB_DIR}/usr/bin/codecontext"
          cat > "${DEB_DIR}/usr/share/applications/codecontext.desktop" <<EOF
          [Desktop Entry]
          Name=CodeContext
          Comment=Zero-reallocation codebase context packer and transactional AI patch applier
          Exec=/usr/bin/codecontext %F
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          EOF
          cat > "${DEB_DIR}/DEBIAN/control" <<EOF
          Package: codecontext
          Version: ${VER}
          Section: devel
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libc6, libwayland-client0 | libx11-6, libxkbcommon0, libfontconfig1
          Maintainer: CodeContext Contributors <noreply@github.com>
          Description: Cross-platform tool for codebase context packing and transactional AI patch application
          EOF
          dpkg-deb --root-owner-group --build "${DEB_DIR}" "out/${{ matrix.pkg_prefix }}.deb"

          RPM_TOP="${RUNNER_TEMP}/rpmbuild"
          mkdir -p "${RPM_TOP}/BUILD" "${RPM_TOP}/RPMS" "${RPM_TOP}/SOURCES" "${RPM_TOP}/SPECS" "${RPM_TOP}/SRPMS"
          cat > "${RPM_TOP}/SPECS/codecontext.spec" <<EOF
          %global debug_package %{nil}
          %define _build_id_links none
          Name:           codecontext
          Version:        ${RPM_VER}
          Release:        1
          Summary:        Zero-reallocation codebase context packer and AI patch applier
          License:        MIT OR Apache-2.0
          BuildArch:      ${{ matrix.rpm_arch }}
          %description
          Cross-platform desktop tool for zero-reallocation codebase context packing and transactional AI patch application.
          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 0755 "${PWD}/dist/codecontext" %{buildroot}/usr/bin/codecontext
          %files
          /usr/bin/codecontext
          EOF
          rpmbuild --define "_topdir ${RPM_TOP}" --target "${{ matrix.rpm_arch }}" -bb "${RPM_TOP}/SPECS/codecontext.spec"
          find "${RPM_TOP}/RPMS" -name "*.rpm" -exec cp {} "out/${{ matrix.pkg_prefix }}.rpm" \;

          ARCH_DIR="arch_root"
          mkdir -p "${ARCH_DIR}/usr/bin"
          cp "dist/${{ matrix.out_bin }}" "${ARCH_DIR}/usr/bin/codecontext"
          chmod 0755 "${ARCH_DIR}/usr/bin/codecontext"
          cat > "${ARCH_DIR}/.PKGINFO" <<EOF
          pkgname = codecontext
          pkgbase = codecontext
          pkgver = ${RPM_VER}-1
          pkgdesc = Cross-platform desktop tool for codebase context packing and AI patch application
          url = https://github.com/NIKIRIKI7/CodeContext
          builddate = $(date +%s)
          packager = CodeContext CI
          size = $(stat -c%s "dist/${{ matrix.out_bin }}")
          arch = ${{ matrix.arch_pkg_arch }}
          license = MIT
          license = Apache-2.0
          EOF
          tar -C "${ARCH_DIR}" --zstd -cf "out/${{ matrix.pkg_prefix }}.pkg.tar.zst" .PKGINFO usr

          cp "dist/${{ matrix.out_bin }}" "out/${{ matrix.pkg_prefix }}.AppImage"
          chmod 0755 "out/${{ matrix.pkg_prefix }}.AppImage"

          cd out
          for f in *; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Package macOS artifacts (.tar.gz, .zip, .dmg, .pkg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          PKG_VER="$(echo "${VER}" | cut -d '-' -f 1)"
          mkdir -p dist out
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.out_bin }}"
          chmod 0755 "dist/${{ matrix.out_bin }}"
          cp LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION dist/

          tar -C dist -czf "out/${{ matrix.pkg_prefix }}.tar.gz" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION
          (cd dist && zip -q "../out/${{ matrix.pkg_prefix }}.zip" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION)

          APP_DIR="dmg_stage/CodeContext.app/Contents"
          mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources"
          cp "dist/${{ matrix.out_bin }}" "${APP_DIR}/MacOS/codecontext"
          chmod 0755 "${APP_DIR}/MacOS/codecontext"
          printf "APPL????" > "${APP_DIR}/PkgInfo"
          python3 -c '
          import pathlib, plistlib, sys
          ver, pkg_ver, out_p = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          plist = {
              "CFBundleExecutable": "codecontext",
              "CFBundleIdentifier": "io.github.nikiriki7.codecontext",
              "CFBundleName": "CodeContext",
              "CFBundleDisplayName": "CodeContext",
              "CFBundleVersion": ver,
              "CFBundleShortVersionString": pkg_ver,
              "CFBundlePackageType": "APPL",
              "NSHighResolutionCapable": True,
          }
          out_p.write_bytes(plistlib.dumps(plist))
          ' "${VER}" "${PKG_VER}" "${APP_DIR}/Info.plist"
          ln -s /Applications dmg_stage/Applications
          for _ in 1 2 3; do
            hdiutil create -volname "CodeContext" -srcfolder dmg_stage -ov -format UDZO "out/${{ matrix.pkg_prefix }}.dmg" && break || sleep 2
          done
          pkgbuild --root dmg_stage/CodeContext.app --install-location /Applications/CodeContext.app --identifier io.github.nikiriki7.codecontext --version "${PKG_VER}" "out/${{ matrix.pkg_prefix }}.pkg"

          cd out
          for f in *; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload target release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  build-macos-universal:
    name: Release (macOS Universal2 .dmg, .pkg, .zip, .tar.gz)
    needs: build-release-artifacts
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Apple Silicon and Intel macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: mac_inputs

      - name: Create Universal2 Fat Binary, App Bundle, .dmg, .pkg, .zip & .tar.gz
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          PKG_VER="$(echo "${VER}" | cut -d '-' -f 1)"
          mkdir -p arm64 x86_64 universal_dist out
          tar -xzf mac_inputs/release-aarch64-apple-darwin/codecontext-aarch64-apple-darwin.tar.gz -C arm64
          tar -xzf mac_inputs/release-x86_64-apple-darwin/codecontext-x86_64-apple-darwin.tar.gz -C x86_64

          lipo -create arm64/codecontext x86_64/codecontext -output universal_dist/codecontext
          chmod 0755 universal_dist/codecontext
          cp LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION universal_dist/

          tar -C universal_dist -czf out/codecontext-universal-apple-darwin.tar.gz codecontext LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION
          (cd universal_dist && zip -q ../out/codecontext-universal-apple-darwin.zip codecontext LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION)

          APP_DIR="univ_stage/CodeContext.app/Contents"
          mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources"
          cp universal_dist/codecontext "${APP_DIR}/MacOS/codecontext"
          printf "APPL????" > "${APP_DIR}/PkgInfo"
          python3 -c '
          import pathlib, plistlib, sys
          ver, pkg_ver, out_p = sys.argv[1], sys.argv[2], pathlib.Path(sys.argv[3])
          plist = {
              "CFBundleExecutable": "codecontext",
              "CFBundleIdentifier": "io.github.nikiriki7.codecontext",
              "CFBundleName": "CodeContext",
              "CFBundleDisplayName": "CodeContext",
              "CFBundleVersion": ver,
              "CFBundleShortVersionString": pkg_ver,
              "CFBundlePackageType": "APPL",
              "NSHighResolutionCapable": True,
          }
          out_p.write_bytes(plistlib.dumps(plist))
          ' "${VER}" "${PKG_VER}" "${APP_DIR}/Info.plist"
          ln -s /Applications univ_stage/Applications
          for _ in 1 2 3; do
            hdiutil create -volname "CodeContext Universal" -srcfolder univ_stage -ov -format UDZO out/codecontext-universal-apple-darwin.dmg && break || sleep 2
          done
          pkgbuild --root univ_stage/CodeContext.app --install-location /Applications/CodeContext.app --identifier io.github.nikiriki7.codecontext --version "${PKG_VER}" out/codecontext-universal-apple-darwin.pkg

          cd out
          for f in *; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload Universal2 macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-universal-apple-darwin
          path: out/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release & Signed Manifest
    needs: [build-release-artifacts, build-macos-universal]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt, bilingual release notes, and signed releases-index.json
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "RELEASE_TAG=v${VER}" >> "${GITHUB_ENV}"
          python3 - "${VER}" <<'PY_NOTES'
          import pathlib, re, sys

          ver = sys.argv[1]
          def extract_section(path_str: str) -> str:
              p = pathlib.Path(path_str)
              if not p.exists():
                  return ""
              text = p.read_text(encoding="utf-8")
              pattern = rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              m = re.search(pattern, text)
              return m.group(1).strip() if m else ""

          ru_notes = extract_section("CHANGELOG.md")
          en_notes = extract_section("CHANGELOG.en.md")
          body = [
              f"# CodeContext v{ver}",
              "",
              "🌍 **Language / Язык:** [🇷🇺 Русский](#ru-notes) · [🇬🇧 English](#en-notes)",
              "",
              "<a id=\"ru-notes\"></a>",
              f"## 🇷🇺 Изменения в версии v{ver} (RU)",
              ru_notes or f"Релиз CodeContext v{ver}.",
              "",
              "---",
              "",
              "<a id=\"en-notes\"></a>",
              f"## 🇬🇧 Release Notes v{ver} (EN)",
              en_notes or f"CodeContext v{ver} release.",
          ]
          pathlib.Path("artifacts/RELEASE_NOTES.md").write_text("\n".join(body) + "\n", encoding="utf-8")
          PY_NOTES

          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

          python3 - "${VER}" "${GITHUB_REPOSITORY:-NIKIRIKI7/CodeContext}" <<'PY'
          import datetime, hashlib, json, pathlib, sys

          ver = sys.argv[1]
          repo = sys.argv[2]
          pub_key = "c0dec0de7e57ed2551970b11c8e9a4f2d1b3c5e7a9f0123456789abcdef01234"
          channel = "alpha" if "alpha" in ver else ("beta" if "beta" in ver else "stable")

          targets = [
              ("x86_64-pc-windows-msvc", "codecontext-x86_64-pc-windows-msvc.zip"),
              ("aarch64-pc-windows-msvc", "codecontext-aarch64-pc-windows-msvc.zip"),
              ("x86_64-unknown-linux-gnu", "codecontext-x86_64-unknown-linux-gnu.tar.gz"),
              ("aarch64-unknown-linux-gnu", "codecontext-aarch64-unknown-linux-gnu.tar.gz"),
              ("aarch64-apple-darwin", "codecontext-aarch64-apple-darwin.tar.gz"),
              ("x86_64-apple-darwin", "codecontext-x86_64-apple-darwin.tar.gz"),
          ]

          artifacts_list = []
          for target, filename in targets:
              p = pathlib.Path(filename)
              if not p.exists():
                  continue
              sha = hashlib.sha256(p.read_bytes()).hexdigest()
              canonical = f"codecontext-sig-v1|{ver}|{target}|{sha.lower()}|{pub_key.lower()}"
              sig = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
              url = f"https://github.com/{repo}/releases/download/v{ver}/{filename}"
              artifacts_list.append({
                  "target": target,
                  "url": url,
                  "sha256": sha,
                  "signature": sig,
              })

          manifest = {
              "version": ver,
              "channel": channel,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "changelog": f"Release v{ver}",
              "artifacts": artifacts_list,
          }
          pathlib.Path("releases-index.json").write_text(json.dumps([manifest], indent=2) + "\n", encoding="utf-8")
          PY

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: artifacts/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.7z
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.tar.gz
            artifacts/*.tar.xz
            artifacts/*.tar.zst
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.pkg
            artifacts/SHA256SUMS.txt
            artifacts/releases-index.json