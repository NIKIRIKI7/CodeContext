name: Release Distribution

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release-artifacts:
    name: Build Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: app.exe
            out_bin: codecontext.exe
            archive_name: codecontext-x86_64-pc-windows-msvc.zip
            rustflags: "-C target-cpu=x86-64-v3 -C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=/OPT:REF,ICF"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: app
            out_bin: codecontext
            archive_name: codecontext-x86_64-unknown-linux-gnu.tar.gz
            rustflags: "-C target-cpu=x86-64-v3 -C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=-fuse-ld=lld -C link-arg=-Wl,--gc-sections,--icf=all,-O3"
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: app
            out_bin: codecontext
            archive_name: codecontext-aarch64-apple-darwin.tar.gz
            rustflags: "-C target-cpu=apple-m1 -C llvm-args=-inline-threshold=400 -C llvm-args=-unroll-threshold=300 -C force-frame-pointers=no -C symbol-mangling-version=v0 -C link-arg=-Wl,-dead_strip"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Git tag matches VERSION and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          echo "Tag=${TAG_VER}, VERSION=${FILE_VER}, Cargo.toml=${CARGO_VER}"
          test "${TAG_VER}" = "${FILE_VER}"
          test "${TAG_VER}" = "${CARGO_VER}"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lld clang libclang-dev pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxi-dev

      - name: Install Rust stable toolchain with LLVM PGO tools
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Run full release test suite & allocation invariants
        run: |
          cargo test --package app --test architecture --locked
          cargo nextest run --workspace --release --locked
          cargo test --release --locked --package scanner --test heap_allocations -- --test-threads=1

      - name: Compile maximally optimized release binary with PGO (Profile-Guided Optimization)
        shell: bash
        run: |
          PGO_DIR="${RUNNER_TEMP}/pgo-profiles"
          rm -rf "${PGO_DIR}"
          mkdir -p "${PGO_DIR}"

          echo "=== [PGO 1/3] Building instrumented binary ==="
          RUSTFLAGS="${{ matrix.rustflags }} -C profile-generate=${PGO_DIR}" \
            cargo build --release --locked --package app --target ${{ matrix.target }}

          echo "=== [PGO 2/3] Training profile on real repository workload ==="
          for _ in 1 2 3 4 5; do
            "./target/${{ matrix.target }}/release/${{ matrix.bin_name }}" --pack-headless . || true
          done

          LLVM_BIN_DIR="$(dirname "$(rustc --print target-libdir)")/bin"
          "${LLVM_BIN_DIR}/llvm-profdata" merge -o "${PGO_DIR}/merged.profdata" "${PGO_DIR}"

          echo "=== [PGO 3/3] Recompiling with PGO + Fat LTO + CGU=1 ==="
          cargo clean --release --package app --package scanner --package apply --package config --package core
          RUSTFLAGS="${{ matrix.rustflags }} -C profile-use=${PGO_DIR}/merged.profdata -C llvm-args=-pgo-warn-missing-function" \
            cargo build --release --locked --package app --target ${{ matrix.target }}

      - name: Package release archive & SHA-256 checksum
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.out_bin }}"
          cp LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION dist/
          if [ "${RUNNER_OS}" = "Windows" ]; then
            (cd dist && 7z a -tzip "../${{ matrix.archive_name }}" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION)
          else
            chmod +x "dist/${{ matrix.out_bin }}"
            tar -C dist -czf "${{ matrix.archive_name }}" "${{ matrix.out_bin }}" LICENSE-MIT LICENSE-APACHE CHANGELOG.md VERSION
          fi
          shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish-github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt