name: CI & Multi-Platform Build Matrix

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality-gate:
    name: Format, Clippy, Deny & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux system libraries for GPUI & Platform
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils lld clang libclang-dev pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxi-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.7.8

      - name: Verify VERSION synchronization with Cargo.toml
        run: |
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          echo "VERSION=${FILE_VER}, Cargo.toml=${CARGO_VER}"
          test "${FILE_VER}" = "${CARGO_VER}"

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy strict lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check licenses, bans & security advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Run DDD & Ports-and-Adapters architectural fitness functions
        run: cargo test --package app --test architecture --locked -- --nocapture

      - name: Verify FreeBSD & Linux musl target compatibility
        run: |
          rustup target add x86_64-unknown-freebsd x86_64-unknown-linux-musl
          cargo check --locked --target x86_64-unknown-freebsd -p core -p config -p scanner -p apply
          cargo check --locked --target x86_64-unknown-linux-musl -p core -p config -p scanner -p apply

  test-and-release-build:
    name: Build & Test (${{ matrix.label }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: app.exe
            artifact_name: codecontext-windows-x86_64.exe
            run_tests: true
          - label: Windows ARM64 (MSVC)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin_name: app.exe
            artifact_name: codecontext-windows-aarch64.exe
            run_tests: true
          - label: Linux x86_64 (Ubuntu/Debian/Fedora/Arch)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: app
            artifact_name: codecontext-linux-x86_64
            run_tests: true
          - label: Linux ARM64 (aarch64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: app
            artifact_name: codecontext-linux-aarch64
            run_tests: true
          - label: macOS Apple Silicon (aarch64)
            os: macos-latest
            target: aarch64-apple-darwin
            bin_name: app
            artifact_name: codecontext-macos-aarch64
            run_tests: true
          - label: macOS Intel (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            bin_name: app
            artifact_name: codecontext-macos-x86_64
            run_tests: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils lld clang libclang-dev pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxi-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-nextest
        if: matrix.run_tests
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.7.8
        with:
          key: ci-${{ matrix.target }}

      - name: Run workspace test suite (nextest --release)
        if: matrix.run_tests
        run: cargo nextest run --workspace --release --locked --target ${{ matrix.target }}

      - name: Verify zero-reallocation heap invariant (dhat)
        if: matrix.run_tests
        run: cargo test --release --locked --target ${{ matrix.target }} --package scanner --test heap_allocations -- --test-threads=1 --nocapture

      - name: Build maximally optimized release binary (Fat LTO, CGU=1, Strip)
        run: cargo build --release --locked --package app --target ${{ matrix.target }}

      - name: Smoke-test compiled binary (--version)
        if: matrix.run_tests
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin_name }} --version

      - name: Upload optimized release binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin_name }}
          if-no-files-found: error

  linux-distros-matrix:
    name: Distro Verification (${{ matrix.distro }})
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian Bookworm
            image: debian:bookworm
          - distro: Fedora Latest (RPM)
            image: fedora:latest
          - distro: Arch Linux (Pacman)
            image: archlinux:latest
          - distro: openSUSE Tumbleweed
            image: opensuse/tumbleweed
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install C linker (binutils, gcc, lld) and system prerequisites
        shell: sh
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends build-essential binutils lld curl ca-certificates pkg-config git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y gcc binutils lld make curl ca-certificates pkgconf-pkg-config git
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm base-devel binutils lld curl ca-certificates pkgconf git
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive install gcc binutils lld make curl ca-certificates pkg-config git
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Verify Core, Config, Scanner & Apply Subdomains
        shell: sh
        run: cargo test --locked -p core -p config -p scanner -p apply