name: CI & Multi-Platform Build Matrix

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality-gate:
    name: Format, Clippy, Deny & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries for GPUI & Platform
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lld clang libclang-dev pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxi-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify VERSION synchronization with Cargo.toml
        run: |
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          echo "VERSION=${FILE_VER}, Cargo.toml=${CARGO_VER}"
          test "${FILE_VER}" = "${CARGO_VER}"

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy strict lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check licenses, bans & security advisories (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Run DDD & Ports-and-Adapters architectural fitness functions
        run: cargo test --package app --test architecture --locked -- --nocapture

  test-and-release-build:
    name: Build & Test (${{ matrix.label }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: app.exe
            artifact_name: codecontext-windows-x86_64.exe
            run_tests: true
          - label: Windows ARM64 (MSVC)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin_name: app.exe
            artifact_name: codecontext-windows-aarch64.exe
            run_tests: true
          - label: Linux x86_64 (Ubuntu/Debian/Fedora/Arch)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: app
            artifact_name: codecontext-linux-x86_64
            run_tests: true
          - label: Linux ARM64 (aarch64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: app
            artifact_name: codecontext-linux-aarch64
            run_tests: true
          - label: macOS Apple Silicon (aarch64)
            os: macos-latest
            target: aarch64-apple-darwin
            bin_name: app
            artifact_name: codecontext-macos-aarch64
            run_tests: true
          - label: macOS Intel (x86_64)
            os: macos-latest
            target: x86_64-apple-darwin
            bin_name: app
            artifact_name: codecontext-macos-x86_64
            run_tests: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lld clang libclang-dev pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxi-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-nextest
        if: matrix.run_tests
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.target }}

      - name: Run workspace test suite (nextest --release)
        if: matrix.run_tests
        run: cargo nextest run --workspace --release --locked --target ${{ matrix.target }}

      - name: Verify zero-reallocation heap invariant (dhat)
        if: matrix.run_tests
        run: cargo test --release --locked --target ${{ matrix.target }} --package scanner --test heap_allocations -- --test-threads=1 --nocapture

      - name: Build maximally optimized release binary (Fat LTO, CGU=1, Strip)
        run: cargo build --release --locked --package app --target ${{ matrix.target }}

      - name: Smoke-test compiled binary (--version)
        if: matrix.run_tests
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin_name }} --version

      - name: Upload optimized release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin_name }}
          if-no-files-found: error

  linux-distros-and-freebsd:
    name: Distro & BSD Verification (${{ matrix.distro }})
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Debian Bookworm
            image: debian:bookworm
          - distro: Fedora Latest (RPM)
            image: fedora:latest
          - distro: Arch Linux (Pacman)
            image: archlinux:latest
          - distro: Alpine Linux (musl)
            image: alpine:latest
          - distro: FreeBSD x86_64 (Cross-Check)
            image: ubuntu:24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install container dependencies and Rust
        shell: sh
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config git
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y curl ca-certificates gcc make pkgconf-pkg-config git
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm curl ca-certificates base-devel pkgconf git
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl ca-certificates build-base pkgconf git
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Core, Config, Scanner & Apply Subdomains
        shell: sh
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ "${{ matrix.distro }}" = "FreeBSD x86_64 (Cross-Check)" ]; then
            rustup target add x86_64-unknown-freebsd
            cargo check --locked --target x86_64-unknown-freebsd -p core -p config -p scanner -p apply
          else
            cargo test --release --locked -p core -p config -p scanner -p apply
          fi